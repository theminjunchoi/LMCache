name: gRPC performance

# Compares the PR against its base on a real MP server in every gRPC mode.
# See .github/scripts/grpc_perf_check.py for what is measured.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - "dev"
    paths:
      - "lmcache/v1/multiprocess/**"
      - "lmcache/v1/mp_observability/**"
      - "requirements/common.txt"
      - "requirements/grpc_native.txt"
      - ".github/scripts/grpc_perf_check.py"
      - ".github/workflows/grpc_perf.yml"

defaults:
  run:
    shell: bash

concurrency:
  group: grpc-perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  grpc-perf:
    name: gRPC performance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/dev' }}

    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
            **/requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt
          python -m pip install -r requirements/common.txt
          python -m pip install -r requirements/grpc_native.txt

      # Each build gets its own venv on top of the shared dependencies.
      - name: Install the base and head builds
        run: |
          git worktree add ../base "${BASE_SHA}"
          for build in base head; do
            src=$([ "$build" = base ] && echo ../base || echo .)
            python -m venv --system-site-packages "../venv-$build"
            NO_GPU_EXT=1 "../venv-$build/bin/pip" install -q --no-deps \
              --no-build-isolation -e "$src"
          done

      - name: Compare
        run: |
          python .github/scripts/grpc_perf_check.py compare \
            --base-python ../venv-base/bin/python \
            --head-python ../venv-head/bin/python
